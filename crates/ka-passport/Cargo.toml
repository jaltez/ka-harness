[package]
name = "ka-passport"
description = "ka passport: subscription OAuth token sources (Claude Pro/Max) over the OS keyring"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
ka-dialect = { workspace = true, features = ["passport"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
sha2 = { workspace = true }
parking_lot = { workspace = true }
# `net` rides along transitively today (reqwest/hyper); naming it keeps
# the callback listener explicit instead of relying on unification
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
parking_lot = { workspace = true }

[lints]
workspace = true
