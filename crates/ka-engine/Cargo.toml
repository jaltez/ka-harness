[package]
name = "ka-engine"
description = "ka engine: turn machine over Command/Event queues + layered strict-TOML config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
reqwest = { workspace = true }
ka-protocol = { workspace = true }
ka-dialect = { workspace = true }
ka-strand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
schemars = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
flate2 = { workspace = true }
ka-sandbox = { workspace = true }
parking_lot = { workspace = true }
rquickjs = { workspace = true, optional = true }

[dev-dependencies]
parking_lot = { workspace = true }

[features]
# TOOL-04 code mode: the `code` hand runs a short JavaScript script in an
# embedded QuickJS runtime (rquickjs) and returns only the final value to
# the model. Default-OFF — the default binary stays byte-identical.
code = ["dep:rquickjs"]
# Exposes trust-store test redirection so integration contract suites
# can approve temp projects without touching the real trust file.
test-util = []

# The safe-mode contract needs trust::test_support (cfg-gated, so plain
# integration builds can't see it); CI and `cargo test --all-features`
# run it, featureless local runs skip it instead of failing to compile.
[[test]]
name = "bare_mode_contract"
required-features = ["test-util"]

[[test]]
name = "project_root_contract"
required-features = ["test-util"]

# engine_e2e drives trust + mcp-cache redirection (cfg-gated the same
# way); featureless runs skip the suite instead of failing to compile.
[[test]]
name = "engine_e2e"
required-features = ["test-util"]


# feature_toggle_contract drives the same trust redirection.
[[test]]
name = "feature_toggle_contract"
required-features = ["test-util"]

# context_contracts drives the same trust + data-dir redirection.
[[test]]
name = "context_contracts"
required-features = ["test-util"]

[lints]
workspace = true
