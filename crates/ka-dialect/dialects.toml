# ka dialect catalog — seed rows shipped in the binary.
# Rows default to placeholder pricing (priced = false — surfaces never show
# costs from unverified rows); vendor-verified rows set priced = true.

[dialects."anthropic/claude-sonnet-5"]
wire = "anthropic_messages"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
context = 200_000
max_output = 64_000
efforts = ["low", "medium", "high", "max"]
input = ["text", "image"]
cache = "control"
ratio = 3.6
priced = false
[dialects."anthropic/claude-sonnet-5".price]
input_per_mtok = 3.0
output_per_mtok = 15.0
[dialects."anthropic/claude-sonnet-5".flags]
reasoning_field = "thinking"
[dialects."anthropic/claude-sonnet-5".effort_budgets]
low = 2048
medium = 8192
high = 16_384
max = 32_768

[dialects."openai/gpt-5.1"]
wire = "openai_chat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
context = 400_000
max_output = 128_000
efforts = ["low", "medium", "high"]
input = ["text", "image"]
cache = "key"
ratio = 4.0
priced = false
[dialects."openai/gpt-5.1".price]
input_per_mtok = 1.25
output_per_mtok = 10.0
[dialects."openai/gpt-5.1".flags]
reasoning_field = "reasoning"
max_tokens_field = "max_completion_tokens"

[dialects."ollama/qwen3-32b"]
wire = "openai_chat"
base_url = "http://127.0.0.1:11434/v1"
discovery = "ollama"
context = 131_072
input = ["text"]
cache = "off"
ratio = 3.2
first_byte_timeout_ms = 0
[dialects."ollama/qwen3-32b".flags]
replay_reasoning = true

[dialects."openai/o4-mini"]
