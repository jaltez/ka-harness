[dialects."deepseek/deepseek-flash"]
wire = "openai_chat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
doc_url = "https://api-docs.deepseek.com/quick_start/pricing"
context = 1_000_000
max_output = 384_000
input = ["text", "image"]
priced = true
[dialects."deepseek/deepseek-flash".price]
input_per_mtok = 0.30
output_per_mtok = 1.20

# z.ai GLM-5.3 family: thinking is always on (thinking.type accepts only
# "enabled"); depth is controlled by reasoning_effort (low/high/max,
# default max). Curated rows carry the efforts list + the reasoning flag
# over the generated models.dev entries.
[dialects."zai/glm-5.3"]
wire = "openai_chat"
base_url = "https://api.z.ai/api/paas/v4"
api_key_env = "ZHIPU_API_KEY"
doc_url = "https://docs.z.ai/guides/overview/pricing"
context = 1000000
max_output = 131072
