[package]
name = "ka-harness"
description = "ka: a model-agnostic, very-low-footprint coding agent (TUI + headless NDJSON)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ai", "agent", "cli", "coding-agent", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ka"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
ka-index = { workspace = true, optional = true }
ka-engine = { workspace = true }
ka-dialect = { workspace = true }
ka-strand = { workspace = true }
ka-term = { workspace = true }
ka-protocol = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
ka-sandbox = { workspace = true }

[lints]
workspace = true

[features]
default = []
index = ["dep:ka-index"]
