name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Dependency allowlist (the ka binary's graph — agent-product concerns stay out)
        run: cargo run -p xtask --quiet -- deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p ka-harness --release --target x86_64-unknown-linux-musl
      - run: ls -l target/x86_64-unknown-linux-musl/release/ka
      - name: Size gate (footprint contract, stripped musl binary, 10 MB max)
        run: cargo run -p xtask --quiet -- size --bin target/x86_64-unknown-linux-musl/release/ka

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools time
      - run: cargo build -p ka-harness --release --target x86_64-unknown-linux-musl
      # --quick: session-bench baselines are per-machine (bench/README);
      # the full gate runs on the release machine before tagging
      - run: cargo run -p xtask --quiet -- bench --quick --bin target/x86_64-unknown-linux-musl/release/ka

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (pubkey embedded for ka update verification)
        env:
          KA_PUBKEY: ${{ secrets.KA_PUBKEY }}
        run: cargo build -p ka-harness --release --target x86_64-unknown-linux-musl
      - name: Size gate (footprint contract, stripped musl binary, 10 MB max)
        run: cargo run -p xtask --quiet -- size --bin target/x86_64-unknown-linux-musl/release/ka
      - name: Package
        run: |
          tar czf ka-x86_64-unknown-linux-musl.tar.gz -C target/x86_64-unknown-linux-musl/release ka
          sha256sum ka-x86_64-unknown-linux-musl.tar.gz > ka-x86_64-unknown-linux-musl.tar.gz.sha256
      - name: Sign
        env:
          KA_SIGNING_KEY: ${{ secrets.KA_SIGNING_KEY }}
        run: cargo run -p xtask --quiet -- sign ka-x86_64-unknown-linux-musl.tar.gz
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ka-x86_64-unknown-linux-musl.tar.gz
            ka-x86_64-unknown-linux-musl.tar.gz.sig
            ka-x86_64-unknown-linux-musl.tar.gz.sha256
